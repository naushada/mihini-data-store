# meta-mihini -- recipes for the Mihini data-store stack on the Raspberry Pi 3B.
#
# Targets Scarthgap (5.0 LTS) and the raspberrypi3-64 machine from meta-raspberrypi.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mihini"
BBFILE_PATTERN_mihini := "^${LAYERDIR}/"
BBFILE_PRIORITY_mihini = "6"

LAYERSERIES_COMPAT_mihini = "scarthgap"

# Requires the base + OpenEmbedded + Raspberry Pi layers (see bblayers.conf.sample).
LAYERDEPENDS_mihini = "core openembedded-layer raspberrypi"
